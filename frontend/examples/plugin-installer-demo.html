<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeKnora · 扩展能力插件安装</title>
  <style>
    /* ===== Reset & 基础变量（仿腾讯 WeKnora 浅灰调）===== */
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --brand: #07c05f;            /* 腾讯绿 */
      --brand-soft: rgba(7, 192, 95, 0.08);
      --brand-border: rgba(7, 192, 95, 0.5);
      --text-primary: #1f2329;
      --text-secondary: #4e5969;
      --text-placeholder: #86909c;
      --text-disabled: #c9cdd4;
      --bg-page: #f5f7fa;
      --bg-container: #ffffff;
      --bg-component: #f2f3f5;
      --stroke: #e5e6eb;
      --stroke-soft: #f0f1f3;
      --danger: #f76560;
      --warning: #ff8800;
      --radius-card: 8px;
      --radius-control: 6px;
      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-popover: 0 6px 24px rgba(15, 23, 42, 0.12);
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
    }
    button { font: inherit; cursor: pointer; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { color: #05a64d; }

    /* ===== 顶部条 ===== */
    .topbar {
      height: 56px;
      background: #1f2329;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 24px;
      font-size: 15px;
      font-weight: 500;
    }
    .topbar__brand { display: flex; align-items: center; gap: 8px; }
    .topbar__brand::before {
      content: "W";
      width: 24px; height: 24px;
      border-radius: 6px;
      background: var(--brand);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px;
    }
    .topbar__nav { margin-left: 32px; display: flex; gap: 4px; }
    .topbar__nav a {
      color: rgba(255, 255, 255, 0.7);
      padding: 6px 12px;
      border-radius: 4px;
    }
    .topbar__nav a.is-active,
    .topbar__nav a:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }

    /* ===== 主体布局 ===== */
    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: calc(100vh - 56px);
    }
    .sidebar {
      background: var(--bg-container);
      border-right: 1px solid var(--stroke);
      padding: 20px 12px;
    }
    .sidebar__group { margin-bottom: 16px; }
    .sidebar__title {
      font-size: 12px;
      color: var(--text-placeholder);
      padding: 4px 12px;
      margin-bottom: 4px;
    }
    .sidebar__item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .sidebar__item:hover { background: var(--bg-component); color: var(--text-primary); }
    .sidebar__item.is-active {
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 500;
    }
    .sidebar__icon {
      width: 16px; height: 16px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .main { padding: 28px 32px; }

    /* ===== 区块头 ===== */
    .section-header { margin-bottom: 24px; }
    .section-header h2 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 6px;
    }
    .section-header p {
      color: var(--text-secondary);
      font-size: 13px;
      margin: 0;
    }

    /* ===== 数据源网格：已有卡片 + 加号卡片 ===== */
    .ds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .ds-card {
      background: var(--bg-container);
      border: 1px solid var(--stroke);
      border-radius: var(--radius-card);
      padding: 16px;
      display: flex;
      gap: 12px;
      box-shadow: var(--shadow-card);
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .ds-card--clickable { cursor: pointer; }
    .ds-card--clickable:hover {
      border-color: var(--brand-border);
      box-shadow: 0 4px 12px rgba(7, 192, 95, 0.08);
    }
    .ds-card__icon {
      width: 36px; height: 36px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 15px;
      background: var(--bg-component);
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .ds-card__body { flex: 1; min-width: 0; }
    .ds-card__title { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
    .ds-card__meta {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex; align-items: center; gap: 6px;
    }
    .ds-card__status {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--brand); font-size: 12px;
    }
    .ds-card__status::before {
      content: ""; width: 6px; height: 6px;
      border-radius: 50%; background: currentColor;
    }

    /* ★ 加号卡片（核心：灰色虚线 + 居中大加号）*/
    .ds-card--add {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 96px;
      border-style: dashed;
      border-color: var(--stroke);
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      color: var(--text-placeholder);
    }
    .ds-card--add:hover {
      border-color: var(--brand);
      color: var(--brand);
      background: var(--brand-soft);
      box-shadow: none;
    }
    .ds-card--add__icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--bg-component);
      color: var(--text-placeholder);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .ds-card--add:hover .ds-card--add__icon {
      background: var(--brand);
      color: #fff;
    }
    .ds-card--add__icon svg { width: 22px; height: 22px; }
    .ds-card--add__label {
      font-size: 13px; font-weight: 500;
    }

    /* ===== 抽屉 / 安装对话框 ===== */
    .drawer-mask {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.4);
      display: flex; justify-content: flex-end;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
      z-index: 1000;
    }
    .drawer-mask.is-open { opacity: 1; pointer-events: auto; }
    .drawer {
      width: 640px; max-width: 100%;
      height: 100%;
      background: var(--bg-container);
      box-shadow: var(--shadow-popover);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }
    .drawer-mask.is-open .drawer { transform: translateX(0); }
    .drawer__header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--stroke);
      display: flex; align-items: center; gap: 12px;
    }
    .drawer__icon {
      width: 36px; height: 36px;
      border-radius: 9px;
      background: var(--bg-component);
      display: flex; align-items: center; justify-content: center;
    }
    .drawer__title { font-size: 16px; font-weight: 600; flex: 1; }
    .drawer__desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .drawer__close {
      width: 32px; height: 32px;
      border: none; background: transparent;
      border-radius: 4px;
      color: var(--text-placeholder);
      display: flex; align-items: center; justify-content: center;
    }
    .drawer__close:hover { background: var(--bg-component); color: var(--text-primary); }

    .drawer__body { flex: 1; overflow-y: auto; padding: 24px; }

    .drawer__footer {
      padding: 14px 24px;
      border-top: 1px solid var(--stroke);
      display: flex; align-items: center; gap: 8px;
      justify-content: flex-end;
    }

    /* ===== 步骤指示器 ===== */
    .stepper {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--stroke);
    }
    .step {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px;
      color: var(--text-placeholder);
      flex: 1;
    }
    .step__num {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1px solid var(--stroke);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600;
      background: transparent;
      color: var(--text-placeholder);
    }
    .step.is-active { color: var(--brand); font-weight: 500; }
    .step.is-active .step__num { background: var(--brand); color: #fff; border-color: var(--brand); }
    .step.is-done { color: var(--text-secondary); }
    .step.is-done .step__num { background: var(--brand-soft); color: var(--brand); border-color: transparent; }

    /* ===== Step 0: 选类型卡片网格 ===== */
    .type-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .type-card {
      background: var(--bg-container);
      border: 1px solid var(--stroke);
      border-radius: 6px;
      padding: 14px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      font: inherit; color: inherit;
    }
    .type-card:hover {
      border-color: var(--brand-border);
      box-shadow: 0 4px 12px rgba(7, 192, 95, 0.08);
    }
    .type-card.is-selected {
      border-color: var(--brand);
      background: var(--brand-soft);
    }
    .type-card.is-disabled { opacity: 0.5; cursor: not-allowed; }
    .type-card__header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    .type-card__name { font-size: 13px; font-weight: 600; }
    .type-card__soon {
      font-size: 10px;
      background: var(--bg-component);
      color: var(--text-placeholder);
      padding: 1px 6px;
      border-radius: 3px;
    }
    .type-card__desc { font-size: 11px; color: var(--text-secondary); line-height: 1.5; }

    /* ===== 通用按钮 ===== */
    .btn {
      height: 32px; padding: 0 16px;
      border-radius: var(--radius-control);
      border: 1px solid var(--stroke);
      background: var(--bg-container);
      color: var(--text-primary);
      font-size: 13px; font-weight: 500;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:hover { border-color: var(--text-placeholder); }
    .btn--primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    .btn--primary:hover { background: #05a64d; border-color: #05a64d; }
    .btn--ghost { background: transparent; }

    .form-item { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 13px; font-weight: 500;
      margin-bottom: 6px; color: var(--text-primary);
    }
    .form-label.is-required::before {
      content: "*"; color: var(--danger);
      margin-right: 4px; font-weight: 500;
    }
    .form-input {
      width: 100%; height: 32px;
      padding: 0 12px;
      border: 1px solid var(--stroke);
      border-radius: var(--radius-control);
      font: inherit; color: var(--text-primary);
      background: var(--bg-container);
    }
    .form-input:focus { outline: none; border-color: var(--brand); }
    .form-hint { font-size: 12px; color: var(--text-placeholder); margin-top: 4px; }

    /* 安装进度动画 */
    .install-progress {
      padding: 24px;
      background: var(--bg-component);
      border-radius: 6px;
      margin: 16px 0;
    }
    .install-step {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0;
      font-size: 13px;
    }
    .install-step__icon {
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .install-step.is-done { color: var(--text-secondary); }
    .install-step.is-done .install-step__icon { color: var(--brand); }
    .install-step.is-running { color: var(--brand); font-weight: 500; }
    .install-step.is-pending { color: var(--text-disabled); }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--brand-soft);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- 顶部条 -->
  <div class="topbar">
    <div class="topbar__brand">WeKnora</div>
    <div class="topbar__nav">
      <a href="#">知识库</a>
      <a href="#">智能问答</a>
      <a href="#" class="is-active">扩展能力</a>
      <a href="#">活动记录</a>
    </div>
  </div>

  <div class="layout">
    <!-- 侧边栏 -->
    <div class="sidebar">
      <div class="sidebar__group">
        <div class="sidebar__title">基础</div>
        <div class="sidebar__item">
          <span class="sidebar__icon">▦</span>基本信息
        </div>
        <div class="sidebar__item">
          <span class="sidebar__icon">▣</span>模型配置
        </div>
        <div class="sidebar__item">
          <span class="sidebar__icon">▤</span>向量存储
        </div>
      </div>
      <div class="sidebar__group">
        <div class="sidebar__title">索引与解析</div>
        <div class="sidebar__item">
          <span class="sidebar__icon">▥</span>解析引擎
        </div>
        <div class="sidebar__item">
          <span class="sidebar__icon">⊞</span>分块设置
        </div>
        <div class="sidebar__item">
          <span class="sidebar__icon">⊟</span>图像处理
        </div>
        <div class="sidebar__item is-active">
          <span class="sidebar__icon">⊕</span>音频处理
        </div>
      </div>
      <div class="sidebar__group">
        <div class="sidebar__title">数据与同步</div>
        <div class="sidebar__item">
          <span class="sidebar__icon">↻</span>数据源
        </div>
        <div class="sidebar__item">
          <span class="sidebar__icon">⟳</span>同步计划
        </div>
        <div class="sidebar__item">
          <span class="sidebar__icon">⎈</span>存储引擎
        </div>
      </div>
    </div>

    <!-- 主区域：扩展能力插件管理 -->
    <div class="main">
      <div class="section-header">
        <h2>扩展能力插件</h2>
        <p>配置外部数据源，自动同步内容到知识库</p>
      </div>

      <div class="ds-grid" id="dsGrid">
        <!-- 已安装的数据源卡片（示例数据） -->
        <div class="ds-card ds-card--clickable">
          <div class="ds-card__icon" style="background:#e8f3ff;color:#3370ff;">F</div>
          <div class="ds-card__body">
            <div class="ds-card__title">飞书 · 文档中心</div>
            <div class="ds-card__meta">
              <span>飞书</span><span>·</span>
              <span class="ds-card__status">已启用</span>
            </div>
          </div>
        </div>
        <div class="ds-card ds-card--clickable">
          <div class="ds-card__icon" style="background:#e8f3ff;color:#3370ff;">L</div>
          <div class="ds-card__body">
            <div class="ds-card__title">Lark · 工程文档</div>
            <div class="ds-card__meta">
              <span>Lark</span><span>·</span>
              <span class="ds-card__status">已启用</span>
            </div>
          </div>
        </div>
        <div class="ds-card ds-card--clickable">
          <div class="ds-card__icon" style="background:#fff;border:1px solid #e5e6eb;">N</div>
          <div class="ds-card__body">
            <div class="ds-card__title">Notion · 团队空间</div>
            <div class="ds-card__meta">
              <span>Notion</span><span>·</span>
              <span class="ds-card__status">已启用</span>
            </div>
          </div>
        </div>

        <!-- ★★★ 加号卡片：点击弹出安装流程 ★★★ -->
        <button class="ds-card ds-card--add" id="addCard" type="button">
          <span class="ds-card--add__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </span>
          <span class="ds-card--add__label">安装插件</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 安装插件抽屉 -->
  <div class="drawer-mask" id="drawerMask">
    <div class="drawer" role="dialog" aria-label="安装扩展能力插件">
      <div class="drawer__header">
        <div class="drawer__icon" id="drawerIcon">⊕</div>
        <div style="flex:1;min-width:0;">
          <div class="drawer__title" id="drawerTitle">安装数据源插件</div>
          <div class="drawer__desc" id="drawerDesc">选择类型</div>
        </div>
        <button class="drawer__close" id="drawerClose" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="drawer__body" id="drawerBody">
        <!-- 步骤指示器（由 JS 动态渲染） -->
      </div>

      <div class="drawer__footer" id="drawerFooter">
        <button class="btn btn--ghost" id="prevBtn" type="button">上一步</button>
        <div style="flex:1"></div>
        <button class="btn" id="cancelBtn" type="button">取消</button>
        <button class="btn btn--primary" id="nextBtn" type="button">下一步</button>
      </div>
    </div>
  </div>

  <script>
    // ========== 状态 ==========
    const state = {
      open: false,
      step: 0,                  // 0=选类型 1=凭证 2=资源 3=安装进度
      selectedType: null,       // 选中的插件类型
      installSteps: [],         // 安装进度步骤
    };

    // 模拟的可用插件（实际应从后端 /api/v1/plugins 拉取）
    const AVAILABLE_PLUGINS = [
      { type: 'feishu',        available: true,  name: '飞书',        desc: '同步飞书文档中心的文档、表格、PDF（含富文本和评论）' },
      { type: 'lark',          available: true,  name: 'Lark',        desc: '同步 Lark 文档和云盘文件（含飞书海外版）' },
      { type: 'feishu_drive',  available: true,  name: '飞书云盘',    desc: '同步指定文件夹下的所有文档' },
      { type: 'notion',        available: true,  name: 'Notion',      desc: '同步 Notion 中的页面和子页面' },
      { type: 'yuque',         available: true,  name: '语雀',        desc: '同步语雀知识库文档' },
      { type: 'gitlab',        available: true,  name: 'GitLab',      desc: '同步 GitLab 项目文档' },
      { type: 'localdir',      available: true,  name: '本地目录',    desc: '同步指定本地文件夹中的文件（不联网）' },
      { type: 'rss',           available: true,  name: 'RSS / Atom',  desc: '订阅 RSS / Atom 信息流' },
      { type: 'ima',           available: true,  name: '腾讯 IMA',    desc: '同步腾讯 IMA 知识库' },
      { type: 'github',        available: false, name: 'GitHub',      desc: '同步 GitHub 仓库的 Issue / 文档' },
    ];

    const STEP_TITLES = ['选择类型', '配置凭证', '选择资源', '安装中'];

    // ========== 渲染 ==========
    function renderStepIndicator() {
      const html = STEP_TITLES.map((title, i) => {
        const cls = i === state.step ? 'is-active' : (i < state.step ? 'is-done' : '');
        const num = i < state.step ? '✓' : (i + 1);
        return `<div class="step ${cls}">
          <span class="step__num">${num}</span>
          <span>${title}</span>
        </div>`;
      }).join('');
      document.getElementById('drawerBody').insertAdjacentHTML(
        'afterbegin',
        `<div class="stepper" id="stepper">${html}</div>`
      );
    }

    function renderStepContent() {
      const body = document.getElementById('drawerBody');
      // 清除旧内容（保留 stepper）
      const stepper = document.getElementById('stepper');
      body.innerHTML = '';
      if (stepper) body.appendChild(stepper);

      if (state.step === 0) renderTypeGrid();
      else if (state.step === 1) renderCredentials();
      else if (state.step === 2) renderResources();
      else if (state.step === 3) renderInstallProgress();
      updateFooter();
      // 顶部副标题
      document.getElementById('drawerDesc').textContent = STEP_TITLES[state.step];
    }

    function renderTypeGrid() {
      const html = `<div class="type-grid">
        ${AVAILABLE_PLUGINS.map(p => `
          <button type="button"
            class="type-card ${!p.available ? 'is-disabled' : ''} ${state.selectedType === p.type ? 'is-selected' : ''}"
            data-type="${p.type}"
            ${!p.available ? 'disabled' : ''}>
            <div class="type-card__header">
              <span class="type-card__name">${p.name}</span>
              ${!p.available ? '<span class="type-card__soon">即将上线</span>' : ''}
            </div>
            <div class="type-card__desc">${p.desc}</div>
          </button>
        `).join('')}
      </div>`;
      document.getElementById('drawerBody').insertAdjacentHTML('beforeend', html);

      document.querySelectorAll('.type-card:not([disabled])').forEach(card => {
        card.addEventListener('click', () => {
          state.selectedType = card.dataset.type;
          renderStepContent();
        });
      });
    }

    function renderCredentials() {
      const plugin = AVAILABLE_PLUGINS.find(p => p.type === state.selectedType);
      const html = `<div>
        <div class="form-item">
          <label class="form-label is-required">插件名称</label>
          <input class="form-input" type="text" value="${plugin.name} 接入" />
          <div class="form-hint">用于在数据源列表中识别此实例</div>
        </div>
        <div class="form-item">
          <label class="form-label is-required">App ID</label>
          <input class="form-input" type="text" placeholder="cli_xxxx" />
        </div>
        <div class="form-item">
          <label class="form-label is-required">App Secret</label>
          <input class="form-input" type="password" placeholder="••••••••" />
        </div>
        <div class="form-item">
          <label class="form-label">基础 URL（可选）</label>
          <input class="form-input" type="text" placeholder="https://open.feishu.cn" />
        </div>
      </div>`;
      document.getElementById('drawerBody').insertAdjacentHTML('beforeend', html);
    }

    function renderResources() {
      const html = `<div>
        <p style="color:var(--text-secondary);font-size:13px;margin:0 0 12px;">
          连接成功！请选择要同步的范围（演示数据）：
        </p>
        <div class="type-card is-selected" style="cursor:default;">
          <div class="type-card__header">
            <span class="type-card__name">📁 全部文档（200 个）</span>
          </div>
          <div class="type-card__desc">已选中根节点，自动包含所有子文档</div>
        </div>
      </div>`;
      document.getElementById('drawerBody').insertAdjacentHTML('beforeend', html);
    }

    function renderInstallProgress() {
      // 模拟安装步骤
      state.installSteps = [
        { name: '校验 Manifest 与权限声明', status: 'running' },
        { name: '下载插件包（独立仓库）', status: 'pending' },
        { name: '安装到 PluginManager', status: 'pending' },
        { name: 'gRPC 握手 + 能力发现', status: 'pending' },
        { name: '注册为可用数据源', status: 'pending' },
      ];
      const html = `<div>
        <p style="color:var(--text-secondary);font-size:13px;margin:0 0 12px;">
          正在安装 <strong>${AVAILABLE_PLUGINS.find(p => p.type === state.selectedType)?.name}</strong>，请稍候…
        </p>
        <div class="install-progress" id="installProgress">
          ${state.installSteps.map((s, i) => `
            <div class="install-step ${s.status}" data-i="${i}">
              <span class="install-step__icon">${
                s.status === 'done' ? '✓' :
                s.status === 'running' ? '<span class="spinner"></span>' :
                '○'
              }</span>
              <span>${s.name}</span>
            </div>
          `).join('')}
        </div>
      </div>`;
      document.getElementById('drawerBody').insertAdjacentHTML('beforeend', html);
    }

    function updateFooter() {
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const cancelBtn = document.getElementById('cancelBtn');

      if (state.step === 0) {
        prevBtn.style.display = 'none';
        nextBtn.style.display = '';
        nextBtn.textContent = '下一步';
        nextBtn.disabled = !state.selectedType;
        cancelBtn.style.display = '';
      } else if (state.step === 1 || state.step === 2) {
        prevBtn.style.display = '';
        nextBtn.style.display = '';
        nextBtn.textContent = state.step === 2 ? '开始安装' : '下一步';
        nextBtn.disabled = false;
        cancelBtn.style.display = '';
      } else if (state.step === 3) {
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        cancelBtn.style.display = 'none';
        // 模拟安装过程
        simulateInstall();
      }
    }

    // 模拟安装（演示用）
    function simulateInstall() {
      let i = 0;
      const tick = () => {
        if (i >= state.installSteps.length) {
          // 安装完成
          setTimeout(() => {
            document.getElementById('drawerBody').insertAdjacentHTML('beforeend',
              '<div style="text-align:center;padding:24px 0;">' +
              '<div style="font-size:32px;color:var(--brand);">✓</div>' +
              '<p style="font-size:14px;color:var(--text-primary);margin:8px 0 16px;">安装成功！</p>' +
              '<button class="btn btn--primary" onclick="closeDrawer()">完成</button>' +
              '</div>');
          }, 300);
          return;
        }
        if (i > 0) state.installSteps[i - 1].status = 'done';
        state.installSteps[i].status = 'running';
        renderInstallProgress();
        i++;
        setTimeout(tick, 600);
      };
      setTimeout(tick, 100);
    }

    // ========== 抽屉控制 ==========
    function openDrawer() {
      state.open = true;
      state.step = 0;
      state.selectedType = null;
      document.getElementById('drawerMask').classList.add('is-open');
      const body = document.getElementById('drawerBody');
      body.innerHTML = '';
      renderStepIndicator();
      renderStepContent();
    }

    function closeDrawer() {
      state.open = false;
      document.getElementById('drawerMask').classList.remove('is-open');
    }

    // ========== 事件绑定 ==========
    document.getElementById('addCard').addEventListener('click', openDrawer);
    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('cancelBtn').addEventListener('click', closeDrawer);
    document.getElementById('drawerMask').addEventListener('click', (e) => {
      if (e.target.id === 'drawerMask') closeDrawer();
    });
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (state.step > 0) { state.step--; renderStepContent(); }
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (state.step < 3) { state.step++; renderStepContent(); }
    });
  </script>
</body>
</html>

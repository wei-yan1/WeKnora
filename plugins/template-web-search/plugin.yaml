api_version: weknora.plugin/v1
id: example.template-search
name: Template Web Search Provider
version: 0.1.0
extension_type: search
protocol_version: v1
weknora_version: ">=0.7 <1.0"
entrypoint: ./template-web-search
permissions:
  network: none
config:
  - key: api_key
    type: secret
    required: false
    description: Provider credential forwarded to the plugin per request
capabilities: [search]
metadata:
  provider_type: template_search
  description: Minimal deterministic search provider example

api_version: weknora.plugin/v1
id: weknora.localdir
name: Local Directory Data Source
version: 1.0.0
extension_type: datasource
protocol_version: v1
entrypoint: ./weknora-plugin-localdir-linux-amd64
weknora_version: ">=1.0 <2.0"
permissions:
  network: none
  read_paths: ["configured-root"]
  data:
    tenants: [self]
    knowledge_bases: [self]
    data_sources: [self]
config:
  - key: root
    type: directory
    required: true
    description: Directory to synchronize
  - key: include_extensions
    type: string[]
    required: false
    description: Optional file extensions such as .md or .txt
capabilities: [incremental, deletion_sync]
metadata:
  description: Sync files from a local directory on the server
  icon: folder-open
  auth_type: none
  priority: 13
